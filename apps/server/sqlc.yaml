version: "2"
sql:
  - engine: sqlite
    schema: internal/storage/sqlc/schema/auth.sql
    queries: internal/storage/sqlc/queries/announcements.sql
    gen:
      go: &strict
        package: announcementsdb
        out: internal/storage/sqlc/announcementsdb
        sql_package: database/sql
        emit_methods_with_db_argument: true
        emit_exported_queries: true
        emit_empty_slices: true
        omit_unused_structs: true
        initialisms: [id, db, url, json, sql, http, https, oidc, cnki, qr, uuid, ai, api, sha256, csv, doi, pmid, issn, eissn, fts, utd, abs, fms, fmscn]
        overrides:
          - db_type: INTEGER
            go_type:
              import: github.com/QianFuv/LitRadar/apps/server/internal/storage/sqlite
              type: Integer
          - db_type: TEXT
            go_type:
              import: github.com/QianFuv/LitRadar/apps/server/internal/storage/sqlite
              type: Text
          - db_type: REAL
            go_type:
              import: github.com/QianFuv/LitRadar/apps/server/internal/storage/sqlite
              type: Number
          - db_type: INTEGER
            nullable: true
            go_type:
              import: github.com/QianFuv/LitRadar/apps/server/internal/storage/sqlite
              type: Integer
              pointer: true
          - db_type: TEXT
            nullable: true
            go_type:
              import: github.com/QianFuv/LitRadar/apps/server/internal/storage/sqlite
              type: Text
              pointer: true
          - db_type: REAL
            nullable: true
            go_type:
              import: github.com/QianFuv/LitRadar/apps/server/internal/storage/sqlite
              type: Number
              pointer: true
  - engine: sqlite
    schema: internal/storage/sqlc/schema/auth.sql
    queries: internal/storage/sqlc/queries/settings.sql
