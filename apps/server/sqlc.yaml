      go:
        <<: *strict
        package: settingsdb
        out: internal/storage/sqlc/settingsdb
        overrides:
          - db_type: TEXT
            go_type:
              import: github.com/QianFuv/LitRadar/apps/server/internal/storage/sqlc/types
              type: SettingText
          - db_type: REAL
            go_type:
              import: github.com/QianFuv/LitRadar/apps/server/internal/storage/sqlc/types
              type: SettingReal
  - engine: sqlite
    schema: internal/storage/sqlc/schema/auth.sql
