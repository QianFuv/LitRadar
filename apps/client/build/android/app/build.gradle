plugins {
    id 'com.android.application'
}

/**
 * Derives the Android version from the repository VERSION file, the only place a release
 * version is written: versionName is MAJOR.MINOR.PATCH and versionCode is
 * major * 10000 + minor * 100 + patch. Fails the build when VERSION is missing or malformed.
 */
def repositoryReleaseVersion() {
    def versionFile = rootProject.file('../../../../VERSION')
    if (!versionFile.isFile()) {
        throw new GradleException("Release VERSION file not found at ${versionFile.canonicalPath}")
    }
    def versionName = versionFile.getText('UTF-8').trim()
    def versionMatcher = versionName =~ /^(0|[1-9]\d{0,4})\.(0|[1-9]\d?)\.(0|[1-9]\d?)$/
    if (!versionMatcher.matches() || (versionMatcher.group(1) as int) > 65535) {
        throw new GradleException("VERSION must be MAJOR.MINOR.PATCH with major up to 65535 and minor and patch below 100, got '${versionName}'")
    }
    return [
        name: versionName,
        code: (versionMatcher.group(1) as int) * 10000 + (versionMatcher.group(2) as int) * 100 + (versionMatcher.group(3) as int),
    ]
}

def releaseVersion = repositoryReleaseVersion()

android {
    namespace = 'com.wails.app'
    compileSdk = 36

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId = "com.qianfuv.litradar"
        minSdk = 29
        targetSdk = 36
        versionCode = releaseVersion.code
        versionName = releaseVersion.name

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    def keystoreFile = System.getenv("ANDROID_SIGNING_KEYSTORE")
    def hasKeystore = keystoreFile != null && !keystoreFile.trim().isEmpty()

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile = file(keystoreFile)
                storePassword = System.getenv("ANDROID_SIGNING_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("ANDROID_SIGNING_KEY_ALIAS")
                keyPassword = System.getenv("ANDROID_SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }

    packagingOptions {
        doNotStrip '*/arm64-v8a/libwails.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
