plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.wails.app'
    compileSdk = 36

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId = "com.qianfuv.litradar"
        minSdk = 29
        targetSdk = 36
        versionCode = 402
        versionName = "0.4.2"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    def keystoreFile = System.getenv("ANDROID_SIGNING_KEYSTORE")
    def hasKeystore = keystoreFile != null && !keystoreFile.trim().isEmpty()

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile = file(keystoreFile)
                storePassword = System.getenv("ANDROID_SIGNING_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("ANDROID_SIGNING_KEY_ALIAS")
                keyPassword = System.getenv("ANDROID_SIGNING_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable = true
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = ['src/main/assets']
        }
    }

    packagingOptions {
        doNotStrip '*/arm64-v8a/libwails.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
