name: litradar

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    networks: [backend]
    image: ghcr.io/qianfuv/litradar-server:latest
    volumes:
      - ${LITRADAR_DATA_DIR:-./data}:/app/data:rw
    secrets:
      - litradar_key
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
        compress: "true"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --show-error http://127.0.0.1:8000/health/ready >/dev/null",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  client-web:
    build:
      context: .
      dockerfile: apps/client/build/docker/Dockerfile.server
    image: ghcr.io/qianfuv/litradar-client-web:latest
    environment:
      WAILS_SERVER_HOST: 0.0.0.0
      WAILS_SERVER_PORT: "8080"
    networks: [frontend]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  gateway:
    image: caddy:2.11.2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    ports:
      - "${LITRADAR_BIND_ADDRESS:-127.0.0.1}:${LITRADAR_PORT:-8000}:8000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [backend, frontend]
    depends_on:
      server:
        condition: service_healthy
      client-web:
        condition: service_started
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

networks:
  backend:
    ipam:
      config:
        - subnet: ${LITRADAR_BACKEND_SUBNET:-172.30.42.0/24}
  frontend:
    internal: true

secrets:
  litradar_key:
    file: ${LITRADAR_SECRET_KEY_FILE:-./secrets/litradar.key}
