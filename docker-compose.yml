name: litradar

services:
  litradar:
    build: .
    image: ghcr.io/qianfuv/litradar:latest
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data:rw
    secrets:
      - litradar_key
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
        compress: "true"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --show-error http://127.0.0.1:8000/health/ready >/dev/null",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Wave 2: add client-web (Wails Server Build) and caddy here.
  # Caddy routes /api*, /mcp*, /docs*, /openapi.json and /health/* to litradar.
  # All other paths route to client-web; its image is defined by the client release.

secrets:
  litradar_key:
    file: ./secrets/litradar.key
