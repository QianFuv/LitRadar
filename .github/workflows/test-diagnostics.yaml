name: Test Diagnostics

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: test-diagnostics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Stage 2: quality diagnostics; informational, never a release prerequisite.
  coverage:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout source
        id: checkout_source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        id: set_up_go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            third_party/go-sdk/go.mod
            third_party/go-sdk/go.sum
            third_party/go-sqlite3/go.mod
            third_party/go-sqlite3/go.sum

      - name: Set up pnpm
        id: set_up_pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Set up Node.js
        id: set_up_node_js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        id: install_frontend_dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Generate threshold-free coverage diagnostics
        id: diagnostics
        run: |
          started_at="$(date +%s)"
          set +e
          node tests/test.mjs diagnostics --ci
          status="$?"
          set -e
          echo "duration_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Record Go coverage provenance
        id: record_go_coverage_provenance
        if: always()
        env:
          CI_STAGE: quality
          CI_PLATFORMS: linux/amd64
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
          CI_REPORT_ROOT: target/go-coverage
        run: node scripts/ci-report.mjs manifest .

      - name: Upload Go coverage
        id: upload_go_coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-diagnostics
          path: target/go-coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Record frontend coverage provenance
        id: record_frontend_coverage_provenance
        if: always()
        env:
          CI_STAGE: quality
          CI_PLATFORMS: independent
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
          CI_REPORT_ROOT: app/coverage
        run: node scripts/ci-report.mjs manifest .

      - name: Upload frontend coverage
        id: upload_frontend_coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage-diagnostics
          path: app/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Report quality summary
        id: report_quality_summary
        if: always()
        env:
          CI_STAGE: quality
          CI_PLATFORMS: linux/amd64
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
          CI_REPORT_ROOT: target/go-coverage
        run: node scripts/ci-report.mjs summary

      - name: Report informational coverage policy
        id: report_informational_coverage_policy
        if: always()
        run: echo "Coverage is informational only; no threshold or pull-request gate." >> "$GITHUB_STEP_SUMMARY"
