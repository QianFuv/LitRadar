name: Test Diagnostics

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: test-diagnostics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir app install --frozen-lockfile

      - name: Build pinned search tokenizer
        run: node scripts/build-simple-tokenizer.mjs

      - name: Generate threshold-free coverage diagnostics
        id: diagnostics
        run: |
          started_at="$(date +%s)"
          set +e
          node tests/test.mjs diagnostics --ci
          status="$?"
          set -e
          echo "duration_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload Go coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage-diagnostics
          path: target/go-coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage-diagnostics
          path: app/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Write diagnostics summary
        if: always()
        env:
          DIAGNOSTICS_DURATION: ${{ steps.diagnostics.outputs.duration_seconds }}
          DIAGNOSTICS_RESULT: ${{ steps.diagnostics.outcome }}
        run: |
          {
            echo "## Scheduled test diagnostics"
            echo
            echo "- Status: ${DIAGNOSTICS_RESULT:-not run}"
            echo "- Duration: ${DIAGNOSTICS_DURATION:-n/a}s"
            echo "- Go report: target/go-coverage/"
            echo "- Frontend report: app/coverage/"
            echo "- Policy: informational only; no threshold or pull-request gate."
          } >> "$GITHUB_STEP_SUMMARY"
