name: Reusable Client Checks and Packages

on:
  workflow_call:
    inputs:
      source_ref:
        required: false
        type: string
      release:
        required: false
        type: boolean
        default: false
      version:
        required: false
        type: string
    secrets:
      ANDROID_SIGNING_KEYSTORE:
        required: false
      ANDROID_SIGNING_KEYSTORE_PASSWORD:
        required: false
      ANDROID_SIGNING_KEY_ALIAS:
        required: false
      ANDROID_SIGNING_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Client ${{ matrix.target }} (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            platform: linux/amd64
            os: ubuntu-26.04
          - target: windows
            platform: windows/amd64
            os: windows-latest
          - target: android
            platform: android/arm64
            os: ubuntu-26.04
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GOLANGCI_LINT_VERSION: v2.15.0
    steps:
      - name: Checkout exact product source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            go.mod
            go.sum
            third_party/go-sdk/go.mod
            third_party/go-sdk/go.sum
      - name: Set up pnpm
        id: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
      - name: Set up Node.js
        id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies and pinned build tools
        id: tools
        run: |
          pnpm install --frozen-lockfile
          go install github.com/go-task/task/v3/cmd/task@v3.54.0
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
      - name: Resolve Android signing availability
        id: signing
        if: matrix.target == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          IS_RELEASE: ${{ inputs.release }}
        run: |
          mkdir -p release-results/client
          if [[ "$IS_RELEASE" == true && ( -z "$KEYSTORE_BASE64" || -z "$ANDROID_SIGNING_KEYSTORE_PASSWORD" || -z "$ANDROID_SIGNING_KEY_ALIAS" || -z "$ANDROID_SIGNING_KEY_PASSWORD" ) ]]; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo '{"android":"omitted"}' > release-results/client/signing-status.json
            echo '::warning::Android APK omitted: all four Android signing secrets are required for a release.'
            echo '### Android APK omitted' >> "$GITHUB_STEP_SUMMARY"
            echo 'Missing Android signing secrets. Server, Web and Windows artifacts continue; no debug APK is published.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
            if [[ "$IS_RELEASE" == true ]]; then
              export KEYSTORE_PATH="$RUNNER_TEMP/litradar-release.keystore"
              node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(process.env.KEYSTORE_PATH, Buffer.from(process.env.KEYSTORE_BASE64, "base64"), {mode: 0o600})'
              echo "ANDROID_SIGNING_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
              echo '{"android":"signed"}' > release-results/client/signing-status.json
            else
              echo '{"android":"quality"}' > release-results/client/signing-status.json
            fi
          fi
      - name: Set up Java 21 and Android SDK with NDK r28
        id: android_tools
        if: matrix.target == 'android' && steps.signing.outputs.build == 'true'
        run: |
          test -d "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" = 0
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Check Wails web host
        id: web_host
        if: matrix.target == 'web'
        working-directory: apps/client
        env:
          CGO_ENABLED: "0"
        run: |
          test -z "$(gofmt -l ./*.go internal)"
          go vet ./internal/...
          go test -p 1 ./internal/...
      - name: Build contracted client output
        id: package
        if: matrix.target != 'android' || steps.signing.outputs.build == 'true'
        working-directory: apps/client
        env:
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ matrix.target == 'android' && secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD || '' }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ matrix.target == 'android' && secrets.ANDROID_SIGNING_KEY_ALIAS || '' }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ matrix.target == 'android' && secrets.ANDROID_SIGNING_KEY_PASSWORD || '' }}
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            web) task package:web; CGO_ENABLED=0 go vet -tags server,production . ;;
            windows) task package:windows ;;
            android) task package:android ;;
          esac
      - name: Lint client Go packages with target build tags
        id: lint
        if: matrix.target != 'android' || steps.signing.outputs.build == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release-results/client
          golangci-lint version
          case "$TARGET" in
            web)
              CGO_ENABLED=0 GOOS=linux GOARCH=amd64 golangci-lint run --modules-download-mode readonly --build-tags server,production ./apps/client/... 2>&1 | tee release-results/client/lint.log
              ;;
            windows)
              CGO_ENABLED=0 GOOS=windows GOARCH=amd64 golangci-lint run --modules-download-mode readonly --build-tags production ./apps/client/... 2>&1 | tee release-results/client/lint.log
              CGO_ENABLED=0 GOOS=windows GOARCH=amd64 golangci-lint run --modules-download-mode readonly --build-tags production,smoke ./apps/client/... 2>&1 | tee release-results/client/lint-smoke.log
              ;;
            android)
              CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang" CGO_ENABLED=1 GOOS=android GOARCH=arm64 golangci-lint run --modules-download-mode readonly --build-tags android,production ./apps/client/... 2>&1 | tee release-results/client/lint.log
              ;;
          esac
      - name: Verify signed Android package
        id: verify_signing
        if: inputs.release && matrix.target == 'android' && steps.signing.outputs.build == 'true'
        env:
          ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: node apps/client/scripts/verify-android-signing.mjs
      - name: Build and smoke client web image
        id: image
        if: matrix.target == 'web'
        env:
          SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          version="${RELEASE_VERSION:-$(cat VERSION)}"
          image="ghcr.io/${SOURCE_REPOSITORY,,}-client-web:v${version}"
          docker build -f apps/client/build/docker/Dockerfile.server \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "org.opencontainers.image.version=$version" -t "$image" .
          node apps/client/tests/client-web-smoke.mjs "$image"
          if [[ '${{ inputs.release }}' == true ]]; then
            docker save --output release-results/client/image-client-web.tar "$image"
            docker image inspect "$image" > release-results/client/image-client-web.json
          fi
      - name: Stage exact client artifact
        id: stage
        if: matrix.target != 'android' || steps.signing.outputs.build == 'true'
        env:
          TARGET: ${{ matrix.target }}
        run: node apps/client/scripts/package-client.mjs stage "$TARGET" "${RELEASE_VERSION:-$(cat VERSION)}"
      - name: Record client artifact provenance
        id: evidence
        if: always()
        env:
          CI_STAGE: ${{ inputs.release && 'build-acceptance' || 'quality' }}
          CI_PLATFORMS: ${{ matrix.platform }}
          CI_SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
          CI_REPORT_ROOT: release-results/client
          CI_REQUIRE_FILES: ${{ inputs.release }}
        run: node scripts/ci-report.mjs manifest .
      - name: Upload client evidence and packages
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-${{ matrix.target }}-${{ inputs.release && 'release' || 'quality' }}
          path: release-results/client/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary Android keystore
        id: cleanup_signing
        if: always() && matrix.target == 'android'
        run: rm -f -- "$RUNNER_TEMP/litradar-release.keystore"
      - name: Report client summary
        id: summary
        if: always()
        env:
          CI_STAGE: ${{ inputs.release && 'build-acceptance' || 'quality' }}
          CI_PLATFORMS: ${{ matrix.platform }}
          CI_SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
          CI_REPORT_ROOT: release-results/client
        run: node scripts/ci-report.mjs summary
