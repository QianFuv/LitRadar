name: Release
run-name: Release ${{ inputs.version }} (${{ inputs.operation || 'release' }})

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      operation:
        description: Retry current release, supplement Windows on a public version, or recover latest
        type: choice
        options: [release, windows, promote]
        default: release
        required: true
      version:
        description: Stable version without v (ignored for promote)
        type: string
        required: false

concurrency:
  group: version-release-${{ inputs.version || 'promotion' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  context:
    name: Validate operation and immutable source
    runs-on: ubuntu-latest
    outputs:
      operation: ${{ steps.context.outputs.operation }}
      source: ${{ steps.context.outputs.source }}
      version: ${{ steps.context.outputs.version }}
      published: ${{ steps.context.outputs.published }}
      build: ${{ steps.context.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Verify release contracts
        run: node --test tests/release.test.mjs
      - name: Resolve requested operation
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_OPERATION: ${{ inputs.operation || 'release' }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-context.mjs

  backend-quality:
    name: Backend (manual release)
    needs: context
    if: github.event_name == 'workflow_dispatch' && needs.context.outputs.operation != 'promote'
    uses: ./.github/workflows/backend.yaml
    with:
      source_ref: ${{ needs.context.outputs.source }}

  frontend-quality:
    name: Frontend (manual release)
    needs: context
    if: github.event_name == 'workflow_dispatch' && needs.context.outputs.operation != 'promote'
    uses: ./.github/workflows/frontend.yaml
    with:
      source_ref: ${{ needs.context.outputs.source }}

  windows:
    name: Windows x64 archive and smoke
    needs: [context, backend-quality, frontend-quality]
    if: |
      always() && needs.context.result == 'success' &&
      needs.context.outputs.build == 'true' &&
      (github.event_name != 'workflow_dispatch' ||
       (needs.backend-quality.result == 'success' && needs.frontend-quality.result == 'success'))
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ needs.context.outputs.source }}
      RELEASE_VERSION: ${{ needs.context.outputs.version }}
    steps:
      - name: Checkout packaging tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.context.outputs.source }}
          path: source
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.1"
          cache-dependency-path: source/go.sum
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.32.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/app/pnpm-lock.yaml
      - name: Build web assets from release source
        working-directory: source/app
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
      - name: Package and smoke Windows distribution
        run: node scripts/package-windows.mjs source $env:RELEASE_VERSION $env:SOURCE_SHA
      - name: Upload tested Windows archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-release
          path: |
            release-results/windows/assets/
            release-results/windows/smoke/summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-release-diagnostics
          path: release-results/windows/smoke/*.log
          if-no-files-found: warn
          retention-days: 14

  linux:
    name: Linux images, archives and version publication
    needs: [context, windows]
    if: needs.context.outputs.operation == 'release' && needs.windows.result == 'success'
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Enable arm64 execution
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Validate Docker Compose
        run: |
          mkdir -p release-results
          docker compose -f docker-compose.yml \
            config --format json > release-results/compose.json
          jq -e \
            --arg image "ghcr.io/qianfuv/litradar:latest" \
            '.services.litradar as $service |
             .name == "litradar" and
             $service.image == $image and
             ($service.ports | length == 1) and
             ($service.ports[0].host_ip == "127.0.0.1") and
             ($service.ports[0].target == 8000) and
             ($service.read_only == true) and
             ($service.cap_drop | index("ALL") != null) and
             ($service.security_opt | index("no-new-privileges:true") != null) and
             ($service.tmpfs | any(contains("noexec") and contains("nosuid") and contains("nodev")))' \
            release-results/compose.json >/dev/null

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: |
          image_name="${REGISTRY}/${SOURCE_REPOSITORY,,}"
          image_tag="${image_name}:latest"
          commit_tag="${image_name}:v${RELEASE_VERSION}"
          created_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          description="$(awk 'NR > 1 && NF { print; exit }' README.md)"
          description_bytes="$(printf '%s' "$description" | wc -c)"
          if [[ -z "$description" || "$description_bytes" -gt 512 ]]; then
            echo "README introduction must fit in 512 UTF-8 bytes" >&2
            exit 1
          fi
          {
            echo "image_name=$image_name"
            echo "image_tag=$image_tag"
            echo "commit_tag=$commit_tag"
            echo "created_at=$created_at"
            echo "description=$description"
          } >> "$GITHUB_OUTPUT"

      - name: Build the tagged image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          tags: |
            ${{ steps.image.outputs.image_tag }}
            ${{ steps.image.outputs.commit_tag }}
          platforms: linux/amd64
          load: true
          labels: |
            org.opencontainers.image.created=${{ steps.image.outputs.created_at }}
            org.opencontainers.image.description=${{ steps.image.outputs.description }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=LitRadar
            org.opencontainers.image.version=${{ needs.context.outputs.version }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke the tagged image
        id: smoke
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          started_at="$(date +%s)"
          set +e
          node tests/container-smoke.mjs "$IMAGE_TAG"
          status="$?"
          set -e
          echo "duration_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Preserve amd64 smoke evidence
        run: cp test-results/container-smoke/summary.json release-results/smoke-amd64.json

      - name: Package tested amd64 binaries
        env:
          COMMIT_TAG: ${{ steps.image.outputs.commit_tag }}
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: |
          test "$(docker run --rm --entrypoint litradar "$COMMIT_TAG" --version)" = "litradar $RELEASE_VERSION"
          node scripts/package-release.mjs "$COMMIT_TAG" amd64 "$RELEASE_VERSION"

      - name: Build arm64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          tags: ${{ steps.image.outputs.commit_tag }}-arm64
          load: true
          provenance: false
          labels: |
            org.opencontainers.image.version=${{ needs.context.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Smoke the arm64 image
        env:
          COMMIT_TAG: ${{ steps.image.outputs.commit_tag }}
        run: |
          node tests/container-smoke.mjs "$COMMIT_TAG-arm64"
          cp test-results/container-smoke/summary.json release-results/smoke-arm64.json

      - name: Package tested arm64 binaries
        env:
          COMMIT_TAG: ${{ steps.image.outputs.commit_tag }}
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: |
          test "$(docker run --rm --entrypoint litradar "$COMMIT_TAG-arm64" --version)" = "litradar $RELEASE_VERSION"
          node scripts/package-release.mjs "$COMMIT_TAG-arm64" arm64 "$RELEASE_VERSION"

      - name: Download tested Windows archive
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: windows-release
          path: release-results/windows

      - name: Combine and verify all platform assets
        env:
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: node scripts/release-assets.mjs "$RELEASE_VERSION"

      - name: Prepare binary release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: node scripts/release-github.mjs prepare

      - name: Publish both tested architectures
        id: publish
        env:
          COMMIT_TAG: ${{ steps.image.outputs.commit_tag }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          docker tag "$COMMIT_TAG" "$COMMIT_TAG-amd64"
          docker push "$COMMIT_TAG-amd64"
          docker push "$COMMIT_TAG-arm64"
          docker image inspect "$COMMIT_TAG-amd64" "$COMMIT_TAG-arm64" > release-results/local-image-identities.json
          docker buildx imagetools create --tag "$COMMIT_TAG" "$COMMIT_TAG-amd64" "$COMMIT_TAG-arm64"
          docker buildx imagetools inspect --raw "$COMMIT_TAG" > release-results/published-manifest.json

      - name: Publish binary release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: node scripts/release-github.mjs publish

      - name: Upload container diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: container-release
          path: |
            test-results/container-smoke/
            release-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Write container summary
        if: always()
        env:
          COMMIT_TAG: ${{ steps.image.outputs.commit_tag }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          SMOKE_DURATION: ${{ steps.smoke.outputs.duration_seconds }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
        run: |
          {
            echo "## Container release"
            echo
            echo "- Commit tag: ${COMMIT_TAG:-not available}"
            echo "- Latest tag: ${IMAGE_TAG:-not available}"
            echo "- Smoke status: ${SMOKE_RESULT:-not run}"
            echo "- Smoke duration: ${SMOKE_DURATION:-n/a}s"
            echo "- Push status: ${PUBLISH_RESULT:-not run}"
          } >> "$GITHUB_STEP_SUMMARY"

  supplement-windows:
    name: Add Windows assets without replacing published bytes
    needs: [context, windows]
    if: needs.context.outputs.operation == 'windows' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: windows-release
          path: release-results/windows
      - name: Append verified Windows assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
          RELEASE_SOURCE_SHA: ${{ needs.context.outputs.source }}
        run: node scripts/release-github.mjs append-windows

  promote-latest:
    needs: [context, linux, backend-quality, frontend-quality]
    if: |
      always() && needs.context.result == 'success' &&
      (needs.context.outputs.operation == 'promote' ||
       (needs.context.outputs.operation == 'release' &&
        (needs.linux.result == 'success' ||
         (needs.context.outputs.published == 'true' &&
          (github.event_name != 'workflow_dispatch' ||
           (needs.backend-quality.result == 'success' && needs.frontend-quality.result == 'success'))))))
    concurrency:
      group: release-latest
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the highest published stable version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-github.mjs promote
