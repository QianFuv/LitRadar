name: Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

concurrency:
  group: version-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  context:
    name: Validate version and source
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.context.outputs.source }}
      version: ${{ steps.context.outputs.version }}
      published: ${{ steps.context.outputs.published }}
      build: ${{ steps.context.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Resolve release source
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-context.mjs

  windows:
    name: Windows x64 archive and smoke
    needs: context
    if: needs.context.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ needs.context.outputs.source }}
      RELEASE_VERSION: ${{ needs.context.outputs.version }}
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.context.outputs.source }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.1"
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.32.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Restore release web build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/.next/cache
          key: ${{ runner.os }}-next-release-node24-${{ hashFiles('app/pnpm-lock.yaml', 'app/tsconfig*.json', 'app/next.config.ts') }}-${{ env.SOURCE_SHA }}
          restore-keys: |
            ${{ runner.os }}-next-release-node24-${{ hashFiles('app/pnpm-lock.yaml', 'app/tsconfig*.json', 'app/next.config.ts') }}-

      - name: Build web assets from release source
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
      - name: Package and smoke Windows distribution
        run: node scripts/package-windows.mjs . $env:RELEASE_VERSION $env:SOURCE_SHA
      - name: Upload tested Windows archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-release
          path: |
            release-results/windows/assets/
            release-results/windows/smoke/summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: windows-release-diagnostics
          path: release-results/windows/smoke/*.log
          if-no-files-found: warn
          retention-days: 14

  linux:
    name: Linux amd64 image, archive and smoke
    needs: context
    if: needs.context.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.1"
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Resolve image identity
        id: image
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: |
          echo "tag=ghcr.io/${SOURCE_REPOSITORY,,}:v${RELEASE_VERSION}-amd64" >> "$GITHUB_OUTPUT"
          echo "created_at=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
          description="$(awk 'NR > 1 && NF { print; exit }' README.md)"
          description_bytes="$(printf '%s' "$description" | wc -c)"
          if [[ -z "$description" || "$description_bytes" -gt 512 ]]; then
            echo "README introduction must fit in 512 UTF-8 bytes" >&2
            exit 1
          fi
          echo "description=$description" >> "$GITHUB_OUTPUT"
      - name: Validate Docker Compose
        run: |
          mkdir -p release-results
          docker compose -f docker-compose.yml \
            config --format json > release-results/compose.json
          jq -e \
            --arg image "ghcr.io/qianfuv/litradar:latest" \
            '.services.litradar as $service |
             .name == "litradar" and
             $service.image == $image and
             ($service.ports | length == 1) and
             ($service.ports[0].host_ip == "127.0.0.1") and
             ($service.ports[0].target == 8000) and
             ($service.read_only == true) and
             ($service.cap_drop | index("ALL") != null) and
             ($service.security_opt | index("no-new-privileges:true") != null) and
             ($service.tmpfs | any(contains("noexec") and contains("nosuid") and contains("nodev")))' \
            release-results/compose.json >/dev/null

      - name: Build Linux image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        env:
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tag }}
          load: true
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.created=${{ steps.image.outputs.created_at }}
            org.opencontainers.image.description=${{ steps.image.outputs.description }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=LitRadar
            org.opencontainers.image.version=${{ needs.context.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke image and package tested binaries
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: |
          node tests/container-smoke.mjs "$IMAGE_TAG"
          test "$(docker run --rm --entrypoint litradar "$IMAGE_TAG" --version)" = "litradar $RELEASE_VERSION"
          node scripts/package-release.mjs "$IMAGE_TAG" amd64 "$RELEASE_VERSION"
          cp test-results/container-smoke/summary.json release-results/smoke-amd64.json
          docker image inspect "$IMAGE_TAG" > release-results/image-amd64.json
          docker save --output release-results/image-amd64.tar "$IMAGE_TAG"
      - name: Upload tested Linux bytes
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: linux-release
          path: |
            release-results/assets/
            release-results/smoke-amd64.json
            release-results/image-amd64.json
            release-results/image-amd64.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Upload Linux failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: linux-release-diagnostics
          path: test-results/container-smoke/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish verified packages and image
    needs: [context, windows, linux]
    if: >-
      !cancelled() && needs.context.result == 'success' &&
      needs.windows.result == 'success' && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_VERSION: ${{ needs.context.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Download tested Linux bytes
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: linux-release
          path: release-results
      - name: Download tested Windows archive
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: windows-release
          path: release-results/windows
      - name: Load and verify tested image and smoke evidence
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          docker load --input release-results/image-amd64.tar
          docker image inspect "ghcr.io/${SOURCE_REPOSITORY,,}:v${RELEASE_VERSION}-amd64" > release-results/loaded-image.json
          node scripts/release-evidence.mjs
      - name: Combine and verify both platform archives
        run: node scripts/release-assets.mjs "$RELEASE_VERSION"
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare release notes and binary assets
        run: node scripts/release-github.mjs prepare
      - name: Publish tested Linux image
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${SOURCE_REPOSITORY,,}:v${RELEASE_VERSION}"
          docker push "$image-amd64"
          docker buildx imagetools create --tag "$image" "$image-amd64"
          docker buildx imagetools inspect --raw "$image" > release-results/published-manifest.json
      - name: Publish binary release
        run: node scripts/release-github.mjs publish
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-publication
          path: |
            release-results/notes.md
            release-results/assets/SHA256SUMS
            release-results/loaded-image.json
            release-results/published-manifest.json
          if-no-files-found: warn
          retention-days: 14

  promote:
    name: Update latest pointers
    needs: [context, publish]
    if: >-
      !cancelled() && needs.context.result == 'success' &&
      (needs.publish.result == 'success' || needs.context.outputs.published == 'true')
    concurrency:
      group: release-latest
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the highest published stable version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-github.mjs promote

  complete:
    name: Confirm complete release
    needs: [context, windows, linux, publish, promote]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Reject incomplete or skipped publication
        env:
          RELEASE_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/release-status.mjs
      - name: Verify public release and asset membership
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.context.outputs.version }}
        run: node scripts/release-github.mjs verify
