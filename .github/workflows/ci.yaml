name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Retry the current VERSION on main
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-rules:
    name: Release rules
    runs-on: ubuntu-26.04
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
      - name: Verify release contracts
        run: node --test tests/release.test.mjs
      - name: Resolve version increase or explicit retry
        id: version
        if: github.event_name != 'pull_request'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/release-version.mjs

  backend:
    name: Backend
    uses: ./.github/workflows/backend.yaml

  frontend:
    name: Frontend
    uses: ./.github/workflows/frontend.yaml

  release:
    name: Version release
    needs: [release-rules, backend, frontend]
    if: needs.release-rules.outputs.release == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yaml
    with:
      version: ${{ needs.release-rules.outputs.version }}
