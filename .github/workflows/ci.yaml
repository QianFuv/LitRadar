name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Retry the current VERSION on main
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Stage 1: detect-changes. Keep the existing required-check identity.
  release-rules:
    name: Release rules
    runs-on: ubuntu-26.04
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout source
        id: checkout_source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        id: set_up_node_js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
      - name: Verify release contracts
        id: verify_release_contracts
        run: node --test tests/release.test.mjs tests/ci.test.mjs tests/release-web.test.mjs tests/release-platform.test.mjs tests/ci-report.test.mjs
      - name: Resolve version increase or explicit retry
        id: version
        if: github.event_name != 'pull_request'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/release-version.mjs
      - name: Report detect-changes summary
        id: report_detect_changes_summary
        if: always()
        env:
          CI_STAGE: detect-changes
          CI_PLATFORMS: independent
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
        run: node scripts/ci-report.mjs summary

  # Stage 2: quality. Only ordinary runs share cancellation groups.
  backend:
    name: Backend
    needs: release-rules
    if: ${{ !cancelled() }}
    concurrency:
      group: backend-${{ needs.release-rules.outputs.release == 'true' && format('release-{0}', github.run_id) || format('quality-{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) }}
      cancel-in-progress: true
    uses: ./.github/workflows/backend.yaml

  frontend:
    name: Frontend
    needs: release-rules
    if: ${{ !cancelled() }}
    concurrency:
      group: frontend-${{ needs.release-rules.outputs.release == 'true' && format('release-{0}', github.run_id) || format('quality-{0}-{1}', github.event_name, github.event.pull_request.number || github.ref) }}
      cancel-in-progress: true
    uses: ./.github/workflows/frontend.yaml
    with:
      release_web: ${{ needs.release-rules.outputs.release == 'true' }}

  # Stages 3 and 4: build-acceptance, then publish inside the reusable workflow.
  release:
    name: Version release
    needs: [release-rules, backend, frontend]
    if: needs.release-rules.outputs.release == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yaml
    with:
      version: ${{ needs.release-rules.outputs.version }}
      web_artifact_id: ${{ needs.frontend.outputs.web_artifact_id }}
