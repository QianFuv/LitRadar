name: Reusable Frontend Checks

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact product source commit; defaults to the caller commit
        required: false
        type: string

concurrency:
  group: frontend-ci-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: true

env:
  LITRADAR_TEST_CI: "true"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/.next/cache
          key: ${{ runner.os }}-next-ci-node24-${{ hashFiles('app/pnpm-lock.yaml', 'app/tsconfig*.json', 'app/next.config.ts') }}-${{ inputs.source_ref || github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-ci-node24-${{ hashFiles('app/pnpm-lock.yaml', 'app/tsconfig*.json', 'app/next.config.ts') }}-

      - name: Build pinned search tokenizer
        run: node scripts/build-simple-tokenizer.mjs
        working-directory: .

      - name: Check frontend contracts and static quality
        id: frontend_static
        run: |
          started_at="$(date +%s)"
          set +e
          pnpm generate:api:check \
            && pnpm lint \
            && pnpm format:check \
            && pnpm exec tsc --noEmit
          status="$?"
          set -e
          echo "duration_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Test jsdom features
        id: unit_tests
        env:
          LITRADAR_VITEST_JUNIT: ./test-results/vitest/junit.xml
        run: |
          started_at="$(date +%s)"
          set +e
          pnpm test:unit
          status="$?"
          set -e
          echo "duration_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test browser-native components
        id: browser_components
        env:
          LITRADAR_VITEST_JUNIT: ./test-results/vitest-browser/junit.xml
        run: |
          started_at="$(date +%s)"
          set +e
          pnpm test:browser-components
          status="$?"
          set -e
          echo "duration_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Test fixture-backed browser flows
        id: fixture_smoke
        run: |
          started_at="$(date +%s)"
          set +e
          pnpm test:e2e:fixtures
          status="$?"
          set -e
          echo "duration_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Build and test real-backend browser flows
        id: full_stack_smoke
        run: |
          started_at="$(date +%s)"
          set +e
          pnpm test:e2e:full-stack
          status="$?"
          set -e
          echo "duration_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: frontend-test-diagnostics
          path: |
            app/test-results/vitest/
            app/test-results/vitest-browser/
            app/test-results/browser-components/
            app/test-results/playwright-fixtures/
            app/test-results/playwright-full-stack/
            app/playwright-report/fixtures/
            app/playwright-report/full-stack/
          if-no-files-found: warn
          retention-days: 14

      - name: Write frontend summary
        if: always()
        env:
          BROWSER_DURATION: ${{ steps.browser_components.outputs.duration_seconds }}
          BROWSER_RESULT: ${{ steps.browser_components.outcome }}
          FIXTURE_DURATION: ${{ steps.fixture_smoke.outputs.duration_seconds }}
          FIXTURE_RESULT: ${{ steps.fixture_smoke.outcome }}
          FULL_STACK_DURATION: ${{ steps.full_stack_smoke.outputs.duration_seconds }}
          FULL_STACK_RESULT: ${{ steps.full_stack_smoke.outcome }}
          STATIC_DURATION: ${{ steps.frontend_static.outputs.duration_seconds }}
          STATIC_RESULT: ${{ steps.frontend_static.outcome }}
          UNIT_DURATION: ${{ steps.unit_tests.outputs.duration_seconds }}
          UNIT_RESULT: ${{ steps.unit_tests.outcome }}
        run: |
          label() {
            case "$1" in
              success) printf 'Passed' ;;
              failure) printf 'Failed' ;;
              cancelled) printf 'Cancelled' ;;
              skipped) printf 'Skipped' ;;
              *) printf 'Not run' ;;
            esac
          }
          {
            echo "## Frontend test layers"
            echo
            echo "| Layer | Status | Duration |"
            echo "| --- | --- | ---: |"
            echo "| Contracts and static checks | $(label "$STATIC_RESULT") | ${STATIC_DURATION:-n/a}s |"
            echo "| Vitest jsdom | $(label "$UNIT_RESULT") | ${UNIT_DURATION:-n/a}s |"
            echo "| Vitest Chromium | $(label "$BROWSER_RESULT") | ${BROWSER_DURATION:-n/a}s |"
            echo "| Fixture Playwright | $(label "$FIXTURE_RESULT") | ${FIXTURE_DURATION:-n/a}s |"
            echo "| Full-stack Playwright and build | $(label "$FULL_STACK_RESULT") | ${FULL_STACK_DURATION:-n/a}s |"
            echo
            echo "Playwright retries: one in CI, with failOnFlakyTests enabled."
          } >> "$GITHUB_STEP_SUMMARY"
