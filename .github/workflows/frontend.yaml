name: Reusable Frontend Checks

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact product source commit; defaults to the caller commit
        required: false
        type: string
      release_web:
        description: Export tested frontend bytes for this run's release
        required: false
        type: boolean
        default: false
    outputs:
      web_artifact_id:
        description: Immutable artifact ID of the tested static export
        value: ${{ jobs.frontend.outputs.web_artifact_id }}

env:
  LITRADAR_TEST_CI: "true"

permissions:
  contents: read

jobs:
  # Stage 2: quality, including the production frontend build and full-stack acceptance.
  frontend:
    outputs:
      web_artifact_id: ${{ steps.web_export.outputs.artifact-id }}
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout source
        id: checkout_source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Set up Go
        id: set_up_go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
            third_party/go-sdk/go.mod
            third_party/go-sdk/go.sum
            third_party/go-sqlite3/go.mod
            third_party/go-sqlite3/go.sum

      - name: Set up pnpm
        id: set_up_pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Set up Node.js
        id: set_up_node_js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        id: install_frontend_dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        id: restore_next_js_build_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.next/cache
          key: ${{ runner.os }}-next-ci-node26-${{ hashFiles('app/pnpm-lock.yaml', 'app/tsconfig*.json', 'app/next.config.ts') }}-${{ inputs.source_ref || github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-ci-node26-${{ hashFiles('app/pnpm-lock.yaml', 'app/tsconfig*.json', 'app/next.config.ts') }}-

      - name: Build pinned search tokenizer
        id: build_pinned_search_tokenizer
        run: node scripts/build-simple-tokenizer.mjs
        working-directory: .

      - name: Check frontend contracts and static quality
        id: frontend_static
        run: |
          started_at="$(date +%s)"
          set +e
          pnpm generate:api:check \
            && pnpm lint \
            && pnpm format:check \
            && pnpm exec tsc --noEmit
          status="$?"
          set -e
          echo "duration_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Test jsdom features
        id: unit_tests
        env:
          LITRADAR_VITEST_JUNIT: ./test-results/vitest/junit.xml
        run: |
          started_at="$(date +%s)"
          set +e
          pnpm test:unit
          status="$?"
          set -e
          echo "duration_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Install Chromium
        id: install_chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test browser-native components
        id: browser_components
        env:
          LITRADAR_VITEST_JUNIT: ./test-results/vitest-browser/junit.xml
        run: |
          started_at="$(date +%s)"
          set +e
          pnpm test:browser-components
          status="$?"
          set -e
          echo "duration_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Test fixture-backed browser flows
        id: fixture_smoke
        run: |
          started_at="$(date +%s)"
          set +e
          pnpm test:e2e:fixtures
          status="$?"
          set -e
          echo "duration_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Build and test real-backend browser flows
        id: full_stack_smoke
        run: |
          started_at="$(date +%s)"
          set +e
          pnpm test:e2e:full-stack
          status="$?"
          set -e
          echo "duration_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Bind tested frontend export to source
        id: bind_tested_frontend_export_to_source
        if: inputs.release_web
        working-directory: .
        env:
          SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
        run: node scripts/release-web.mjs prepare "$SOURCE_SHA"

      - name: Record tested frontend artifact provenance
        id: record_tested_frontend_artifact_provenance
        if: inputs.release_web
        working-directory: .
        env:
          CI_STAGE: build-acceptance
          CI_PLATFORMS: independent
          CI_SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
          CI_REPORT_ROOT: release-results/web
          CI_INCLUDE_HIDDEN: "true"
          CI_REQUIRE_FILES: "true"
        run: node scripts/ci-report.mjs manifest app/out manifest.json

      - name: Upload tested frontend export
        id: web_export
        if: inputs.release_web
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-web-${{ inputs.source_ref || github.sha }}-${{ github.run_attempt }}
          path: release-results/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Record quality artifact provenance
        id: record_quality_artifact_provenance
        if: always()
        working-directory: .
        env:
          CI_STAGE: quality
          CI_PLATFORMS: linux/amd64
          CI_SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
          CI_REPORT_ROOT: app
          CI_REPORT_FILE: test-results/ci-manifest.json
        run: node scripts/ci-report.mjs manifest test-results/vitest test-results/vitest-browser test-results/browser-components test-results/playwright-fixtures test-results/playwright-full-stack playwright-report/fixtures playwright-report/full-stack

      - name: Upload frontend diagnostics
        id: upload_frontend_diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-test-diagnostics
          path: |
            app/test-results/ci-manifest.json
            app/test-results/vitest/
            app/test-results/vitest-browser/
            app/test-results/browser-components/
            app/test-results/playwright-fixtures/
            app/test-results/playwright-full-stack/
            app/playwright-report/fixtures/
            app/playwright-report/full-stack/
          if-no-files-found: warn
          retention-days: 14

      - name: Report quality summary
        id: report_quality_summary
        if: always()
        working-directory: .
        env:
          CI_STAGE: quality
          CI_PLATFORMS: linux/amd64
          CI_SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
          CI_REPORT_ROOT: app
          CI_REPORT_FILE: test-results/ci-manifest.json
        run: node scripts/ci-report.mjs summary

      - name: Report frontend retry policy
        id: report_frontend_retry_policy
        if: always()
        run: echo "Playwright retries once in CI; failOnFlakyTests remains enabled." >> "$GITHUB_STEP_SUMMARY"
