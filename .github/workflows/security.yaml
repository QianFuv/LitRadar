name: Supply Chain Security

on:
  workflow_call:
  push:
    branches-ignore:
      - "main"
  pull_request:
  schedule:
    - cron: "15 3 * * 1"
  workflow_dispatch:

concurrency:
  group: supply-chain-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-release-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Enable arm64 execution
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install hash-pinned scanners
        run: node scripts/install-security-tools.mjs

      - name: Assemble exact production images
        run: |
          docker buildx build --platform linux/amd64 --load --provenance=false -t litradar:go-test-amd64 .
          docker buildx build --platform linux/arm64 --load --provenance=false -t litradar:go-test-arm64 .

      - name: Run the shared local release policy
        run: node tests/migration/run.mjs --phase security

      - name: Upload secret scanning results
        if: always() && hashFiles('output/security/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: output/security/gitleaks.sarif
          category: gitleaks-full-history

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: supply-chain-results
          path: |
            output/security/*.json
            output/security/*.log
            output/security/*.sarif
            output/security/*/image.spdx.json
            output/security/*/obscura-release.json
            output/security/*/go-inventory/
            output/security/*/native.sha256
            output/security/*/debian-packages.txt
          if-no-files-found: error
          retention-days: 14
