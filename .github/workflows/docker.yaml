name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "osv-scanner.toml"
      - ".gitleaksignore"
      - ".config/nextest.toml"
      - "crates/**"
      - "libs/**"
      - "data/meta/**"
      - ".dockerignore"
      - "Dockerfile"
      - "README.md"
      - "docs/third-party/**"
      - "docker-compose.yml"
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/backend.yaml"
      - ".github/workflows/codeql.yaml"
      - ".github/workflows/frontend.yaml"
      - ".github/workflows/security.yaml"
      - ".github/workflows/docker.yaml"
      - ".github/dependabot.yml"

env:
  REGISTRY: ghcr.io

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      runtime_image: ${{ steps.filter.outputs.runtime_image }}
      backend_workflow: ${{ steps.filter.outputs.backend_workflow }}
      frontend_workflow: ${{ steps.filter.outputs.frontend_workflow }}
      security_workflow: ${{ steps.filter.outputs.security_workflow }}
      codeql_workflow: ${{ steps.filter.outputs.codeql_workflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            runtime_image:
              - "Cargo.toml"
              - "Cargo.lock"
              - "crates/**"
              - "libs/**"
              - "data/meta/**"
              - ".dockerignore"
              - "Dockerfile"
              - "README.md"
              - "docs/third-party/**"
              - "docker-compose.yml"
              - "app/**"
              - "tests/container-smoke.mjs"
              - "tests/data/**"
              - "scripts/build-simple-tokenizer.mjs"
              - ".github/workflows/docker.yaml"
            backend_workflow:
              - ".config/nextest.toml"
              - "tests/test.mjs"
              - ".github/workflows/backend.yaml"
            frontend_workflow:
              - "tests/test.mjs"
              - ".github/workflows/frontend.yaml"
            security_workflow:
              - "Cargo.toml"
              - "Cargo.lock"
              - "crates/**/Cargo.toml"
              - "app/package.json"
              - "app/pnpm-lock.yaml"
              - "deny.toml"
              - "osv-scanner.toml"
              - ".gitleaksignore"
              - ".github/dependabot.yml"
              - ".github/workflows/**"
            codeql_workflow:
              - "Cargo.toml"
              - "Cargo.lock"
              - "crates/**"
              - "app/**"
              - "tests/filter-codeql-sarif.test.mjs"
              - "scripts/filter-codeql-sarif.mjs"
              - ".github/workflows/codeql.yaml"

  backend-quality:
    needs: changes
    if: needs.changes.outputs.runtime_image == 'true' || needs.changes.outputs.backend_workflow == 'true'
    uses: ./.github/workflows/backend.yaml

  frontend-quality:
    needs: changes
    if: needs.changes.outputs.runtime_image == 'true' || needs.changes.outputs.frontend_workflow == 'true'
    uses: ./.github/workflows/frontend.yaml

  security-quality:
    needs: changes
    if: needs.changes.outputs.runtime_image == 'true' || needs.changes.outputs.security_workflow == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/security.yaml

  codeql-quality:
    needs: changes
    if: needs.changes.outputs.runtime_image == 'true' || needs.changes.outputs.codeql_workflow == 'true'
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/codeql.yaml

  build-image:
    needs:
      [
        changes,
        backend-quality,
        frontend-quality,
        security-quality,
        codeql-quality,
      ]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.runtime_image == 'true' &&
      needs.backend-quality.result == 'success' &&
      needs.frontend-quality.result == 'success' &&
      needs.security-quality.result == 'success' &&
      needs.codeql-quality.result == 'success'
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
      commit_tag: ${{ steps.image.outputs.commit_tag }}
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Validate Docker Compose
        run: |
          mkdir -p release-results
          docker compose -f docker-compose.yml \
            config --format json > release-results/compose.json
          jq -e \
            --arg image "ghcr.io/qianfuv/litradar:latest" \
            '.services.litradar as $service |
             .name == "litradar" and
             $service.image == $image and
             ($service.ports | length == 1) and
             ($service.ports[0].host_ip == "127.0.0.1") and
             ($service.ports[0].target == 8000) and
             ($service.read_only == true) and
             ($service.cap_drop | index("ALL") != null) and
             ($service.security_opt | index("no-new-privileges:true") != null) and
             ($service.tmpfs | any(contains("noexec") and contains("nosuid") and contains("nodev")))' \
            release-results/compose.json >/dev/null

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          image_name="${REGISTRY}/${SOURCE_REPOSITORY,,}"
          image_tag="${image_name}:latest"
          commit_tag="${image_name}:sha-${GITHUB_SHA:0:6}"
          created_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          description="$(awk 'NR > 1 && NF { print; exit }' README.md)"
          if [[ -z "$description" || ${#description} -gt 512 ]]; then
            echo "README description must be one nonempty line of at most 512 characters" >&2
            exit 1
          fi
          {
            echo "image_name=$image_name"
            echo "image_tag=$image_tag"
            echo "commit_tag=$commit_tag"
            echo "created_at=$created_at"
            echo "description=$description"
          } >> "$GITHUB_OUTPUT"

      - name: Build the tagged image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          tags: |
            ${{ steps.image.outputs.image_tag }}
            ${{ steps.image.outputs.commit_tag }}
          load: true
          labels: |
            org.opencontainers.image.created=${{ steps.image.outputs.created_at }}
            org.opencontainers.image.description=${{ steps.image.outputs.description }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=LitRadar
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke the tagged image
        id: smoke
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          started_at="$(date +%s)"
          set +e
          node tests/container-smoke.mjs "$IMAGE_TAG"
          status="$?"
          set -e
          echo "duration_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Push both tested image tags
        id: publish
        env:
          COMMIT_TAG: ${{ steps.image.outputs.commit_tag }}
          IMAGE_NAME: ${{ steps.image.outputs.image_name }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          actual_tags="$(docker image ls --format '{{.Repository}}:{{.Tag}}' "$IMAGE_NAME" | LC_ALL=C sort -u)"
          expected_tags="$(printf '%s\n%s\n' "$COMMIT_TAG" "$IMAGE_TAG" | LC_ALL=C sort -u)"
          if [[ "$actual_tags" != "$expected_tags" ]]; then
            echo "Local image tags differ from the two release tags" >&2
            exit 1
          fi
          docker push --all-tags "$IMAGE_NAME"

      - name: Upload container diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: container-release
          path: |
            test-results/container-smoke/
            release-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Write container summary
        if: always()
        env:
          COMMIT_TAG: ${{ steps.image.outputs.commit_tag }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          SMOKE_DURATION: ${{ steps.smoke.outputs.duration_seconds }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
        run: |
          {
            echo "## Container release"
            echo
            echo "- Commit tag: ${COMMIT_TAG:-not available}"
            echo "- Latest tag: ${IMAGE_TAG:-not available}"
            echo "- Smoke status: ${SMOKE_RESULT:-not run}"
            echo "- Smoke duration: ${SMOKE_DURATION:-n/a}s"
            echo "- Push status: ${PUBLISH_RESULT:-not run}"
          } >> "$GITHUB_STEP_SUMMARY"

  workflow-summary:
    name: LitRadar workflow summary
    needs:
      [
        changes,
        backend-quality,
        frontend-quality,
        security-quality,
        codeql-quality,
        build-image,
      ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write workflow summary
        env:
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          BUILD_RESULT: ${{ needs.build-image.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODEQL_RESULT: ${{ needs.codeql-quality.result }}
          COMMIT_TAG: ${{ needs.build-image.outputs.commit_tag }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          IMAGE_TAG: ${{ needs.build-image.outputs.image_tag }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
          SECURITY_RESULT: ${{ needs.security-quality.result }}
        run: |
          status_label() {
            case "$1" in
              success) printf '✅ Success' ;;
              failure) printf '❌ Failure' ;;
              cancelled) printf '⏹️ Cancelled' ;;
              skipped) printf '⏭️ Skipped' ;;
              *) printf '❔ Unknown' ;;
            esac
          }

          run_url="$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"
          commit_url="$SERVER_URL/$REPOSITORY/commit/$COMMIT_SHA"
          short_sha="${COMMIT_SHA:0:6}"

          {
            echo "# LitRadar CI Summary"
            echo
            echo "> Quality, container smoke, and image publication report."
            echo
            echo "## Pipeline"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Change detection | $(status_label "$CHANGES_RESULT") |"
            echo "| Backend quality | $(status_label "$BACKEND_RESULT") |"
            echo "| Frontend quality | $(status_label "$FRONTEND_RESULT") |"
            echo "| Supply-chain security | $(status_label "$SECURITY_RESULT") |"
            echo "| CodeQL security analysis | $(status_label "$CODEQL_RESULT") |"
            echo "| Build, smoke, and publish image | $(status_label "$BUILD_RESULT") |"
            echo
            echo "## Run"
            echo
            echo "- Run: [#$RUN_NUMBER]($run_url)"
            echo "- Commit: [$short_sha]($commit_url)"
            echo "- Branch: $REF_NAME"
            echo "- Event: $EVENT_NAME"
            echo
            echo "## Container image"
            echo
            if [[ "$BUILD_RESULT" == "success" && -n "$IMAGE_TAG" ]]; then
              echo "- Commit tag: $COMMIT_TAG"
              echo "- Latest tag: $IMAGE_TAG"
            else
              echo "No image was published by this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
