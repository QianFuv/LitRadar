name: Quality Checks and Versioned Release

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "version.go"
      - ".gitattributes"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "third_party/**"
      - "scripts/check-go.mjs"
      - "assets/**"
      - "libs/**"
      - "assets/meta/**"
      - ".dockerignore"
      - "Dockerfile"
      - "README.md"
      - "docs/third-party/**"
      - "docker-compose.yml"
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/backend.yaml"
      - ".github/workflows/frontend.yaml"
      - ".github/workflows/docker.yaml"
      - ".github/dependabot.yml"

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.release.outputs.published }}
      runtime_image: ${{ steps.filter.outputs.runtime_image }}
      backend_workflow: ${{ steps.filter.outputs.backend_workflow }}
      frontend_workflow: ${{ steps.filter.outputs.frontend_workflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Verify release rules
        run: node --test tests/release.test.mjs

      - name: Detect version increase
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/release-version.mjs

      - name: Check release identity
        id: release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release-github.mjs check

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            runtime_image:
              - "VERSION"
              - "version.go"
              - ".gitattributes"
              - "go.mod"
              - "go.sum"
              - "cmd/**"
              - "internal/**"
              - "third_party/**"
              - "assets/**"
              - "libs/**"
              - "assets/meta/**"
              - ".dockerignore"
              - "Dockerfile"
              - "README.md"
              - "docs/third-party/**"
              - "docker-compose.yml"
              - "app/**"
              - "tests/container-smoke.mjs"
              - "tests/data/**"
              - "scripts/**"
              - ".github/workflows/docker.yaml"
            backend_workflow:
              - "scripts/check-go.mjs"
              - "tests/test.mjs"
              - "tests/go-dependency.test.mjs"
              - "tests/release.test.mjs"
              - ".github/workflows/backend.yaml"
            frontend_workflow:
              - "tests/test.mjs"
              - ".github/workflows/frontend.yaml"

  backend-quality:
    needs: changes
    if: needs.changes.outputs.runtime_image == 'true' || needs.changes.outputs.backend_workflow == 'true'
    uses: ./.github/workflows/backend.yaml

  frontend-quality:
    needs: changes
    if: needs.changes.outputs.runtime_image == 'true' || needs.changes.outputs.frontend_workflow == 'true'
    uses: ./.github/workflows/frontend.yaml

  build-image:
    concurrency:
      group: version-release-${{ needs.changes.outputs.version }}
      cancel-in-progress: false
    needs: [changes, backend-quality, frontend-quality]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.release == 'true' &&
      needs.changes.outputs.published != 'true' &&
      needs.backend-quality.result == 'success' &&
      needs.frontend-quality.result == 'success'
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
      commit_tag: ${{ steps.image.outputs.commit_tag }}
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Enable arm64 execution
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: true

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Validate Docker Compose
        run: |
          mkdir -p release-results
          docker compose -f docker-compose.yml \
            config --format json > release-results/compose.json
          jq -e \
            --arg image "ghcr.io/qianfuv/litradar:latest" \
            '.services.litradar as $service |
             .name == "litradar" and
             $service.image == $image and
             ($service.ports | length == 1) and
             ($service.ports[0].host_ip == "127.0.0.1") and
             ($service.ports[0].target == 8000) and
             ($service.read_only == true) and
             ($service.cap_drop | index("ALL") != null) and
             ($service.security_opt | index("no-new-privileges:true") != null) and
             ($service.tmpfs | any(contains("noexec") and contains("nosuid") and contains("nodev")))' \
            release-results/compose.json >/dev/null

      - name: Login to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.changes.outputs.version }}
        run: |
          image_name="${REGISTRY}/${SOURCE_REPOSITORY,,}"
          image_tag="${image_name}:latest"
          commit_tag="${image_name}:v${RELEASE_VERSION}"
          created_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          description="$(awk 'NR > 1 && NF { print; exit }' README.md)"
          description_bytes="$(printf '%s' "$description" | wc -c)"
          if [[ -z "$description" || "$description_bytes" -gt 512 ]]; then
            echo "README introduction must fit in 512 UTF-8 bytes" >&2
            exit 1
          fi
          {
            echo "image_name=$image_name"
            echo "image_tag=$image_tag"
            echo "commit_tag=$commit_tag"
            echo "created_at=$created_at"
            echo "description=$description"
          } >> "$GITHUB_OUTPUT"

      - name: Build the tagged image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          DOCKER_BUILD_SUMMARY: "false"
        with:
          context: .
          tags: |
            ${{ steps.image.outputs.image_tag }}
            ${{ steps.image.outputs.commit_tag }}
          platforms: linux/amd64
          load: true
          labels: |
            org.opencontainers.image.created=${{ steps.image.outputs.created_at }}
            org.opencontainers.image.description=${{ steps.image.outputs.description }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=LitRadar
            org.opencontainers.image.version=${{ needs.changes.outputs.version }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke the tagged image
        id: smoke
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          started_at="$(date +%s)"
          set +e
          node tests/container-smoke.mjs "$IMAGE_TAG"
          status="$?"
          set -e
          echo "duration_seconds=$(( $(date +%s) - started_at ))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Preserve amd64 smoke evidence
        run: cp test-results/container-smoke/summary.json release-results/smoke-amd64.json

      - name: Package tested amd64 binaries
        env:
          COMMIT_TAG: ${{ steps.image.outputs.commit_tag }}
          RELEASE_VERSION: ${{ needs.changes.outputs.version }}
        run: |
          test "$(docker run --rm --entrypoint litradar "$COMMIT_TAG" --version)" = "litradar $RELEASE_VERSION"
          node scripts/package-release.mjs "$COMMIT_TAG" amd64 "$RELEASE_VERSION"

      - name: Build arm64 image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          tags: ${{ steps.image.outputs.commit_tag }}-arm64
          load: true
          provenance: false
          labels: |
            org.opencontainers.image.version=${{ needs.changes.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Smoke the arm64 image
        env:
          COMMIT_TAG: ${{ steps.image.outputs.commit_tag }}
        run: |
          node tests/container-smoke.mjs "$COMMIT_TAG-arm64"
          cp test-results/container-smoke/summary.json release-results/smoke-arm64.json

      - name: Package tested arm64 binaries
        env:
          COMMIT_TAG: ${{ steps.image.outputs.commit_tag }}
          RELEASE_VERSION: ${{ needs.changes.outputs.version }}
        run: |
          test "$(docker run --rm --entrypoint litradar "$COMMIT_TAG-arm64" --version)" = "litradar $RELEASE_VERSION"
          node scripts/package-release.mjs "$COMMIT_TAG-arm64" arm64 "$RELEASE_VERSION"

      - name: Prepare binary release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.changes.outputs.version }}
        run: node scripts/release-github.mjs prepare

      - name: Publish both tested architectures
        id: publish
        env:
          COMMIT_TAG: ${{ steps.image.outputs.commit_tag }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
        run: |
          docker tag "$COMMIT_TAG" "$COMMIT_TAG-amd64"
          docker push "$COMMIT_TAG-amd64"
          docker push "$COMMIT_TAG-arm64"
          docker image inspect "$COMMIT_TAG-amd64" "$COMMIT_TAG-arm64" > release-results/local-image-identities.json
          docker buildx imagetools create --tag "$COMMIT_TAG" "$COMMIT_TAG-amd64" "$COMMIT_TAG-arm64"
          docker buildx imagetools inspect --raw "$COMMIT_TAG" > release-results/published-manifest.json

      - name: Publish binary release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.changes.outputs.version }}
        run: node scripts/release-github.mjs publish

      - name: Upload container diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: container-release
          path: |
            test-results/container-smoke/
            release-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Write container summary
        if: always()
        env:
          COMMIT_TAG: ${{ steps.image.outputs.commit_tag }}
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          SMOKE_DURATION: ${{ steps.smoke.outputs.duration_seconds }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
        run: |
          {
            echo "## Container release"
            echo
            echo "- Commit tag: ${COMMIT_TAG:-not available}"
            echo "- Latest tag: ${IMAGE_TAG:-not available}"
            echo "- Smoke status: ${SMOKE_RESULT:-not run}"
            echo "- Smoke duration: ${SMOKE_DURATION:-n/a}s"
            echo "- Push status: ${PUBLISH_RESULT:-not run}"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-latest:
    needs: [changes, build-image]
    if: |
      always() && needs.changes.outputs.release == 'true' &&
      (needs.build-image.result == 'success' || needs.changes.outputs.published == 'true')
    concurrency:
      group: release-latest
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the highest published stable version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-github.mjs promote

  workflow-summary:
    name: LitRadar workflow summary
    needs:
      [changes, backend-quality, frontend-quality, build-image, promote-latest]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write workflow summary
        env:
          BACKEND_RESULT: ${{ needs.backend-quality.result }}
          BUILD_RESULT: ${{ needs.build-image.result }}
          LATEST_RESULT: ${{ needs.promote-latest.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          COMMIT_TAG: ${{ needs.build-image.outputs.commit_tag }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          FRONTEND_RESULT: ${{ needs.frontend-quality.result }}
          IMAGE_TAG: ${{ needs.build-image.outputs.image_tag }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SERVER_URL: ${{ github.server_url }}
          VERSION_CHANGED: ${{ needs.changes.outputs.release }}
          ALREADY_PUBLISHED: ${{ needs.changes.outputs.published }}
        run: |
          status_label() {
            case "$1" in
              success) printf '✅ Success' ;;
              failure) printf '❌ Failure' ;;
              cancelled) printf '⏹️ Cancelled' ;;
              skipped) printf '⏭️ Skipped' ;;
              *) printf '❔ Unknown' ;;
            esac
          }

          run_url="$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"
          commit_url="$SERVER_URL/$REPOSITORY/commit/$COMMIT_SHA"
          short_sha="${COMMIT_SHA:0:6}"

          {
            echo "# LitRadar CI Summary"
            echo
            echo "> Quality, container smoke, and image publication report."
            echo
            echo "## Pipeline"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Change detection | $(status_label "$CHANGES_RESULT") |"
            echo "| Backend quality | $(status_label "$BACKEND_RESULT") |"
            echo "| Frontend quality | $(status_label "$FRONTEND_RESULT") |"
            echo "| Build, smoke, and publish image | $(status_label "$BUILD_RESULT") |"
            echo "| Promote latest stable version | $(status_label "$LATEST_RESULT") |"
            echo
            echo "## Run"
            echo
            echo "- Run: [#$RUN_NUMBER]($run_url)"
            echo "- Commit: [$short_sha]($commit_url)"
            echo "- Branch: $REF_NAME"
            echo "- Event: $EVENT_NAME"
            echo
            echo "## Container image"
            echo
            if [[ "$BUILD_RESULT" == "success" && -n "$IMAGE_TAG" ]]; then
              echo "- Commit tag: $COMMIT_TAG"
              echo "- Latest tag: $IMAGE_TAG"
            else
              if [[ "$VERSION_CHANGED" != "true" ]]; then
                echo "Version unchanged: quality checks only; no release build."
              elif [[ "$ALREADY_PUBLISHED" == "true" ]]; then
                echo "This version is already published for this commit."
              else
                echo "Release incomplete; inspect the failed job and rerun this workflow."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
