name: Reusable Go Checks

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact product source commit; defaults to the caller commit
        required: false
        type: string

concurrency:
  group: backend-ci-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "1"
  GOWORK: "off"
  GOTOOLCHAIN: go1.27.2
  GOENV: "off"
  GOFLAGS: ""

permissions:
  contents: read

jobs:
  backend:
    name: Go checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"

      - name: Verify native compiler
        run: gcc --version

      - name: Build pinned search tokenizer
        run: node scripts/build-simple-tokenizer.mjs --compatibility-oracle

      - name: Run Go static, regular and race checks
        run: node scripts/check-go.mjs

      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-${{ matrix.os }}
          path: test-results/go/
          if-no-files-found: error
          retention-days: 14
