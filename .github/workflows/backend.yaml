name: Backend CI

on:
  workflow_call:
  push:
    branches-ignore:
      - "main"
    paths:
      - ".gitattributes"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "third_party/**"
      - "libs/**"
      - "assets/**"
      - "tests/test.mjs"
      - "tests/go-dependency.test.mjs"
      - "tests/data/**"
      - "scripts/**"
      - ".github/workflows/backend.yaml"
  pull_request:
    paths:
      - ".gitattributes"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "third_party/**"
      - "libs/**"
      - "assets/**"
      - "tests/test.mjs"
      - "tests/go-dependency.test.mjs"
      - "tests/data/**"
      - "scripts/**"
      - ".github/workflows/backend.yaml"

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "1"
  GOWORK: "off"
  GOTOOLCHAIN: go1.27.1
  GOENV: "off"
  GOFLAGS: ""

permissions:
  contents: read

jobs:
  backend:
    name: Go checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.1"
          cache: true

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Verify native compiler
        run: gcc --version

      - name: Build pinned search tokenizer
        if: runner.os == 'Linux'
        run: node scripts/build-simple-tokenizer.mjs

      - name: Run Go static, regular and race checks
        run: node scripts/check-go.mjs

      - name: Upload backend diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: backend-${{ matrix.os }}
          path: test-results/go/
          if-no-files-found: error
          retention-days: 14
